<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHIOPIA AI VIDEO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:25px;background:#111a2e}
h1{color:#55c8ff}
main{max-width:600px;margin:25px auto;padding:20px}
textarea,select,input{width:100%;padding:14px;border-radius:10px;background:#151e30;color:white;font-size:16px;border:1px solid #34435c;margin-top:10px}
textarea{height:130px}
label{display:block;text-align:left;margin-top:20px}
button{width:100%;padding:15px;margin-top:15px;background:#168cff;color:white;border:0;border-radius:10px;font-size:17px}
button:disabled{opacity:.6}
#status,#authStatus{color:#8ed8ff;margin-top:20px;overflow-wrap:anywhere}
video{width:100%;margin-top:20px;border-radius:12px;background:#000}
footer{padding:25px;color:#8290a5}
.panel{background:#111a2e;padding:20px;border-radius:15px;margin-bottom:25px}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>ETHIOPIA AI VIDEO</h1>
<p>Create videos with Artificial Intelligence</p>
</header>

<main>

<div id="authPanel" class="panel">
<h2>Welcome</h2>
<p>Register or Login to continue</p>

<input id="email" type="email" placeholder="Your email address">
<input id="password" type="password" placeholder="Password">

<button onclick="signUp()">Create Account</button>
<button onclick="signIn()">Login</button>

<div id="authStatus"></div>
</div>

<div id="userPanel" class="panel hidden">
<p id="userEmail"></p>
<button onclick="signOut()">Logout</button>
</div>

<div id="generator" class="hidden">
<h2>Text to Video Generator</h2>
<p>Describe the video you want to create.</p>

<textarea id="prompt" maxlength="2000" placeholder="Describe your video here..."></textarea>

<label for="duration">Choose video duration:</label>
<select id="duration">
<option value="3">3 seconds</option>
<option value="5">5 seconds</option>
<option value="10">10 seconds</option>
<option value="15">15 seconds</option>
</select>

<button id="generateButton" onclick="generateVideo()">Generate Video</button>

<div id="status">Ready to create your video.</div>
<div id="videoResult"></div>
</div>

</main>

<footer>© 2026 ETHIOPIA AI VIDEO</footer>

<script>
const SUPABASE_URL = "https://cdarlbwkvkzfyncttrsu.supabase.co";
const SUPABASE_KEY = "sb_publishable_wKzLmIwl4hkxs5OhqkjjqA_r8YAkp1A";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function signUp(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const status = document.getElementById("authStatus");

  if(!email || !password){
    status.textContent = "Enter your email and password.";
    return;
  }

  status.textContent = "Creating account...";

  const {data,error} = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if(error){
    status.textContent = error.message;
    return;
  }

  if(data.session){
    status.textContent = "Account created successfully!";
  }else{
    status.textContent = "Check your email and confirm your account.";
  }
}

async function signIn(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const status = document.getElementById("authStatus");

  if(!email || !password){
    status.textContent = "Enter your email and password.";
    return;
  }

  status.textContent = "Logging in...";

  const {error} = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    status.textContent = error.message;
  }
}

async function signOut(){
  await supabaseClient.auth.signOut();
}

function showUser(session){
  const authPanel = document.getElementById("authPanel");
  const userPanel = document.getElementById("userPanel");
  const generator = document.getElementById("generator");

  if(session){
    authPanel.classList.add("hidden");
    userPanel.classList.remove("hidden");
    generator.classList.remove("hidden");
    document.getElementById("userEmail").textContent =
      "Logged in: " + session.user.email;
  }else{
    authPanel.classList.remove("hidden");
    userPanel.classList.add("hidden");
    generator.classList.add("hidden");
  }
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
  showUser(session);
});

supabaseClient.auth.getSession().then(({data})=>{
  showUser(data.session);
});

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function generateVideo(){

  const prompt = document.getElementById("prompt").value.trim();
  const duration = Number(document.getElementById("duration").value);
  const button = document.getElementById("generateButton");
  const status = document.getElementById("status");
  const videoResult = document.getElementById("videoResult");

  if(!prompt){
    status.textContent = "Please describe your video first.";
    return;
  }

  button.disabled = true;
  button.textContent = "Generating...";
  videoResult.innerHTML = "";
  status.textContent = "Starting video generation...";

  try{
    const response = await fetch("/.netlify/functions/video",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt,duration})
    });

    const result = await response.json();

    if(!response.ok || !result.id){
      throw new Error(
        (result.error || "Could not start video generation.") +
        " Details: " + JSON.stringify(result.details || result)
      );
    }

    const id = result.id;
    status.textContent = "Video is being generated. Please wait...";

    let completed = false;

    for(let i=0; i<38; i++){
      await wait(8000);

      const check = await fetch(
        "/.netlify/functions/video?id=" + encodeURIComponent(id)
      );

      const data = await check.json();

      if(!check.ok){
        throw new Error(data.error || "Could not check video status.");
      }

      status.textContent = "Video status: " + data.status;

      if(data.status === "complete"){
        const download = data.downloads && data.downloads[0];

        if(!download || !download.url){
          throw new Error("No video URL was returned.");
        }

        const video = document.createElement("video");
        video.controls = true;
        video.playsInline = true;
        video.src = download.url;

        videoResult.appendChild(video);
        status.textContent = "Your video is ready!";
        completed = true;
        break;
      }

      if(data.status === "error" || data.status === "canceled"){
        throw new Error("Video generation failed.");
      }
    }

    if(!completed){
      status.textContent = "Generation is taking longer than expected. Job ID: " + id;
    }

  }catch(error){
    status.textContent = "Error: " + error.message;
  }finally{
    button.disabled = false;
    button.textContent = "Generate Video";
  }
}
</script>

</body>
</html>
