
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHIOPIA AI VIDEO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#090d18;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center
}
header{
  padding:25px;
  background:#111a2e
}
h1{color:#55c8ff}
main{
  max-width:600px;
  margin:35px auto;
  padding:20px
}
textarea,select{
  width:100%;
  padding:14px;
  border-radius:10px;
  background:#151e30;
  color:white;
  font-size:16px;
  border:1px solid #34435c;
  margin-top:10px
}
textarea{height:130px}
label{
  display:block;
  text-align:left;
  margin-top:20px
}
button{
  width:100%;
  padding:15px;
  margin-top:15px;
  background:#168cff;
  color:white;
  border:0;
  border-radius:10px;
  font-size:17px
}
button:disabled{
  opacity:.6
}
#status{
  color:#8ed8ff;
  margin-top:20px;
  overflow-wrap:anywhere
}
footer{
  padding:25px;
  color:#8290a5
}
</style>
</head>

<body>

<header>
<h1>ETHIOPIA AI VIDEO</h1>
<p>Create videos with Artificial Intelligence</p>
</header>

<main>
<h2>Text to Video Generator</h2>
<p>Describe the video you want to create.</p>

<textarea
id="prompt"
maxlength="2000"
placeholder="Describe your video here..."
></textarea>

<label for="duration">Choose video duration:</label>

<select id="duration">
<option value="3">3 seconds</option>
<option value="5">5 seconds</option>
<option value="10">10 seconds</option>
<option value="15">15 seconds</option>
</select>

<button id="generateButton" onclick="generateVideo()">
Generate Video
</button>

<div id="status">Ready to create your video.</div>
</main>

<footer>© 2026 ETHIOPIA AI VIDEO</footer>

<script>
async function generateVideo(){

  const prompt = document.getElementById("prompt").value.trim();
  const duration = Number(document.getElementById("duration").value);
  const button = document.getElementById("generateButton");
  const status = document.getElementById("status");

  if(!prompt){
    status.textContent = "Please describe your video first.";
    return;
  }

  button.disabled = true;
  button.textContent = "Please wait...";
  status.textContent = "Starting video generation...";

  try{

    const response = await fetch(
      "/.netlify/functions/video",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          prompt:prompt,
          duration:duration
        })
      }
    );

    const result = await response.json();

    if(!response.ok){
      throw new Error(result.error || "Video generation failed.");
    }

    status.textContent =
      "Video generation started! Job ID: " + (result.id || "Received");

  }catch(error){

    status.textContent = "Error: " + error.message;

  }finally{

    button.disabled = false;
    button.textContent = "Generate Video";

  }
}
</script>

</body>
</html>
